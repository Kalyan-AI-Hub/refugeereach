version: "3.8"

services:
  ollama:
    image: ollama/ollama
    container_name: refugeereach_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: ./app/backend
    container_name: refugeereach_backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data
      - ./models/prompts:/app/prompts
      - backend_db:/app/db
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=gemma4:e4b
      - DB_PATH=/app/db/refugeereach.db
      - CHROMA_PATH=/app/db/chroma
    restart: unless-stopped

  frontend:
    build: ./app/frontend
    container_name: refugeereach_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  ollama_data:
  backend_db:
